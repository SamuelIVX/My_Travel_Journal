name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Test
        run: CI=true npm test -- --watchAll=false

      - name: Build
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: site-build
          path: ./build
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: site-build
          path: ./build

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@47f197a2200bb9de68ba5f48fad1c088eb1c4a32 # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build

      - name: Verify Deployment
        run: |
          url="https://samuelivx.github.io/My_Travel_Journal/"
          for attempt in {1..12}; do
            status="$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
              --output /dev/null --write-out "%{http_code}" "$url" || true)"
            if [ "$status" = "200" ]; then
              echo "Deployed URL returned 200 OK"
              exit 0
            fi
            sleep 10
          done
          echo "Deployed URL returned $status, expected 200"
          exit 1
